# Dependabot alerts and security updates are enabled for every repository by the organization's
# security configuration. This file adds weekly version updates. Per ecosystem, security updates and
# version updates each come as one pull request for major updates and one for minor and patch updates.
# Options: https://docs.github.com/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "Kentico.Xperience.*"
    groups:
      nuget-security-major:
        applies-to: security-updates
        update-types: [major]
      nuget-security-minor-patch:
        applies-to: security-updates
        update-types: [minor, patch]
      nuget-major:
        update-types: [major]
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /examples/DancingGoat
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      npm-security-major:
        applies-to: security-updates
        update-types: [major]
      npm-security-minor-patch:
        applies-to: security-updates
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
